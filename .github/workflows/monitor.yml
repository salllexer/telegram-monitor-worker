name: V2Ray Config Monitor

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: config-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl unzip python3

      - name: Download latest Xray
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["browser_download_url"] for x in d["assets"] if x["name"] == "Xray-linux-64.zip") )')
          curl -fsSL "$url" -o xray.zip
          unzip -q xray.zip xray
          chmod +x xray

      - name: Run due checks
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: python3 runner.py
